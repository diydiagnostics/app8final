<!DOCTYPE html>
<html lang="en">

<!--
DIY Diagnostics LAMP Analyzer App
Simple Version for First-Year Coders

Goal:
Upload an image → analyze color → determine LAMP result

Logic:
- More RED = Pink = NEGATIVE
- More GREEN = Yellow = POSITIVE

This is a proof-of-concept only.
-->

<head>
  <meta charset="utf-8">
  <title>LAMP Diagnostic Analyzer</title>

  <!-- Mobile-friendly setup -->
  <meta name="viewport" content="width=device-width, initial-scale=.7">

  <!-- Mobile (for styling) -->
  <link rel="stylesheet" href="https://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.css" />
  <script src="https://code.jquery.com/jquery-1.9.1.min.js"></script>
  <script src="https://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.js"></script>

  <script>
    // Run after page loads
    window.onload = function () {

      var fileInput = document.getElementById('fileInput');
      var messageDisplayArea = document.getElementById('messageDisplayArea');

      // When user uploads image
      fileInput.addEventListener('change', function () {

        var file = fileInput.files[0];

        // Check if file is an image
        if (!file.type.match("image.*")) {
          messageDisplayArea.innerHTML = "Please upload an image file.";
          return;
        }

        // Read file
        var reader = new FileReader();

        reader.onload = function () {

          messageDisplayArea.innerHTML = "Processing image...";

          var img = new Image();

          img.onload = function () {

            // Clear both canvases
            context.clearRect(0, 0, canvas.width, canvas.height);
            secondCtx.clearRect(0, 0, secondCanvas.width, secondCanvas.height);

            // Draw image to canvas
            context.drawImage(img, 0, 0, 600, 500);

            // Get pixel data
            var imageData = context.getImageData(0, 0, 600, 500);
            var data = imageData.data;

            // Variables to store total colors
            var totalR = 0;
            var totalG = 0;
            var totalB = 0;

            // Loop through every pixel
            for (var i = 0; i < data.length; i += 4) {
              totalR += data[i];       // red
              totalG += data[i + 1];   // green
              totalB += data[i + 2];   // blue
            }

            // Calculate average color
            var pixelCount = data.length / 4;
            var avgR = totalR / pixelCount;
            var avgG = totalG / pixelCount;
            var avgB = totalB / pixelCount;

            // Display RGB values
            messageDisplayArea.innerHTML =
              "Average Red: " + avgR.toFixed(0) + "<br>" +
              "Average Green: " + avgG.toFixed(0) + "<br>" +
              "Average Blue: " + avgB.toFixed(0) + "<br>";

            // Simple LAMP decision
            if (avgR > avgG) {
              messageDisplayArea.innerHTML += "<b>Result: NEGATIVE (Pink)</b>";
              messageDisplayArea.style.color = "red";
            } else {
              messageDisplayArea.innerHTML += "<b>Result: POSITIVE (Yellow)</b>";
              messageDisplayArea.style.color = "green";
            }

            // Show image again on second canvas
            secondCtx.putImageData(imageData, 0, 0);
          };

          img.src = reader.result;
        };

        reader.readAsDataURL(file);
      });
    };
  </script>
</head>

<body>

  <div data-role="page">

    <div data-role="header">
      <h1>LAMP Diagnostic Analyzer</h1>
    </div>

    <div data-role="content">

      <p>
        Upload a LAMP test image. The app will analyze the color and determine if the result is positive or negative.
      </p>

      <!-- Image upload -->
      <input type="file" id="fileInput" style="background-color: #FF6600;">

      <!-- Output -->
      <div id="messageDisplayArea"></div>

      <!-- Original Image -->
      <canvas id="myCanvas" width="600" height="500" style="border:1px solid black;"></canvas>

      <!-- Processed Image -->
      <canvas id="dataCanvas" width="600" height="500" style="border:1px solid black;"></canvas>

      <script>
        // Setup first canvas
        var canvas = document.getElementById('myCanvas');
        var context = canvas.getContext("2d");
        context.fillText("Original image will appear here", 10, 20);

        // Setup second canvas
        var secondCanvas = document.getElementById('dataCanvas');
        var secondCtx = secondCanvas.getContext("2d");
        secondCtx.fillText("Processed image will appear here", 10, 20);
      </script>

    </div>

    <div data-role="footer">
      <p>DIY Diagnostics - UT Austin FRI</p>
    </div>

  </div>

</body>
</html>
